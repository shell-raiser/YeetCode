name: Release Extension

on:
  workflow_run:
    workflows: ['Test Extension']
    types: [completed]

jobs:
  release:
    # Only publish when the test suite succeeded on a push to main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create extension zip
        run: |
          zip -r YeetCodeExtension.zip . -x "node_modules/*" ".git/*" "*.git*" "README.md" "coverage/*" ".github/*" "jest.config.js" "package-lock.json" "npm-shrinkwrap.json" "yarn.lock" "tests/*" "*.test.js" "*.md" "LICENSE" ".gitignore" ".npmrc"
      - name: Install GH CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh
      - name: Delete all existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # List all releases and delete them
          releases=$(gh release list --repo $REPO --limit 100 --json tagName --jq '.[].tagName')
          if [ -n "$releases" ]; then
            echo "$releases" | while read tag; do
              echo "Deleting release $tag"
              gh release delete $tag --repo $REPO --yes || true
            done
          fi
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Extension
          draft: false
          prerelease: false
          generate_release_notes: true
          files: YeetCodeExtension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
